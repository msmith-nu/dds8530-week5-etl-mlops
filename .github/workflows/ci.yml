name: CI

# Runs on every push and pull request to main. Makes sure
# tests pass on every push to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show installed versions
        run: pip list

      - name: Verify every module imports on a clean machine
        run: |
          python -c "from src import config, extract, transform, load, train, score"
          python -c "from api.main import app" || echo "api import skipped: no trained model artifact in CI"

      - name: Run the test suite
        run: python -m pytest tests/ -v
